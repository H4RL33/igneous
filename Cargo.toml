[package]
name = "igneous"
description = "Read and edit Markdown vaults on GNOME"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
adw.workspace = true
async-channel.workspace = true
gtk.workspace = true
igneous-core.workspace = true
igneous-editor.workspace = true
igneous-git.workspace = true
igneous-index.workspace = true
igneous-lint.workspace = true
igneous-markdown.workspace = true
igneous-query.workspace = true
jiff.workspace = true
nucleo-matcher.workspace = true
serde_json.workspace = true
sourceview.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
glib-build-tools.workspace = true

[dev-dependencies]
tempfile.workspace = true

[workspace]
resolver = "3"
members = [
    "crates/igneous-core",
    "crates/igneous-editor",
    "crates/igneous-git",
    "crates/igneous-graph",
    "crates/igneous-index",
    "crates/igneous-lint",
    "crates/igneous-markdown",
    "crates/igneous-query",
    "spikes/live-preview",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "BSD-3-Clause"
authors = ["Harley Welsh <git@harleywelsh.com>"]

[workspace.dependencies]
igneous-core = { path = "crates/igneous-core" }
igneous-editor = { path = "crates/igneous-editor" }
igneous-git = { path = "crates/igneous-git" }
igneous-graph = { path = "crates/igneous-graph" }
igneous-index = { path = "crates/igneous-index" }
igneous-lint = { path = "crates/igneous-lint" }
igneous-markdown = { path = "crates/igneous-markdown" }
igneous-query = { path = "crates/igneous-query" }

anyhow = "1"
async-channel = "2"
blake3 = "1.8"
glib-build-tools = "0.22"
globset = "0.4"
jiff = "0.2"
nucleo-matcher = "0.3"
notify-debouncer-full = "0.7"
pulldown-cmark = { version = "0.13", default-features = false }
rayon = "1"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
saphyr = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2.7"
smallvec = { version = "1", features = ["union", "const_generics"] }
tempfile = "3"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
walkdir = "2"

gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
sourceview = { package = "sourceview5", version = "0.11", features = ["v5_18"] }

insta = "1"
proptest = "1"

[profile.dev.package."*"]
opt-level = 2
